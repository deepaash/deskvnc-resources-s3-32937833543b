<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
<title id="title">Boundary support with consent</title><desc id="desc">An invitation connects a supporter to a recipient who approves and can end the session.</desc>
